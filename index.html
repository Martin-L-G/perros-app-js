<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Perros</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <main>
        <h1>App de perros</h1>
        <div class="controles">
            <input type="text" id="input-raza" placeholder="Ingresá una raza (ej: hound)">
            <button id="btn-buscar">Buscar</button>
        </div>
        <p id="mensaje-carga" style="display: none; text-align: center; font-weight: bold; color: #555;">Cargando fotos de perritos... 🐾</p>
        <div id="contenedor-resultados"></div> 
    </main>
    <script src="script.js"></script>
</body>
</html>
